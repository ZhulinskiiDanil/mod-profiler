name: Build

# The sampler suspends a thread and walks its stack with the Windows x64 unwinder, so it is built for Windows alone.
# Every push gets a .geode in the run's artifacts, a published release gets it attached

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The parts without Geode in them, with GCC too
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run the tests
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

  # The same on Windows with MSVC, and the sampler itself: a thread suspended and its stack walked
  tests-windows:
    name: Tests on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run the tests
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests --config Release
          ctest --test-dir build-tests -C Release --output-on-failure --timeout 120

  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.build-output }}"/*.geode --clobber --repo "${{ github.repository }}"
